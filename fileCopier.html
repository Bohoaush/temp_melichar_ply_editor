<!DOCTYPE html>
<html>
<head>
    <title>temp melichar ply editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        :root {
            --bg: #0e0f12;
            --bg-elev: #16181d;
            --panel: #1b1f27;
            --text: #e6e6e6;
            --muted: #9aa4ad;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-active: #1d4ed8;
            --border: #2a2f38;
            --shadow: 0 6px 24px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.35);
            --radius: 10px;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Calibri, Ubuntu;
            font-size: clamp(13px, 0.35vw + 9px, 16px);
            line-height: 1.45;
            margin: 0;
        }
        input[type="button"], button {
            background-color: var(--primary);
            color: var(--text);
            transition: background-color 0.2s ease, transform 0.05s ease, box-shadow 0.2s ease;
            border: 1px solid transparent;
            padding: 0.3em 0.7em;
            font-size: 0.85em;
            line-height: 1.3;
            white-space: nowrap;
            border-radius: 6px;
            font-family: Calibri, Ubuntu;
            font-weight: 600;
            box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 2px 6px rgba(59,130,246,0.12);
        }
        input[type="button"]:hover, button:hover {
            background-color: var(--primary-hover);
        }
        input[type="button"]:active, button:active {
            background-color: var(--primary-active);
            transform: translateY(1px);
            box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 1px 4px rgba(29,78,216,0.18);
        }
        input[type="text"], input[type="password"], textarea {
            background-color: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.3em 0.5em;
            border-radius: 6px;
            font-family: Calibri, Ubuntu;
            font-size: 0.85em;
            line-height: 1.3;
            max-width: 100%;
        }
        input:focus, textarea:focus {
            outline: 2px solid var(--primary);
            outline-offset: -1px;
        }
        body {
            /* Fill the viewport: toolbar takes what it needs, panels get the rest */
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        #status-view {
            flex: 0 0 auto;
            margin: 10px 12px 0 12px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-elev);
        }
        #status-view:empty { display: none; }
        #button-panel {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            align-items: center;
            padding: 10px 12px;
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, rgba(27,31,39,0.92), rgba(27,31,39,0.86));
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .tb-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            min-width: 0;
        }
        #userlabel {
            flex: 1 1 12em;
            text-align: center;
            background-color: var(--bg-elev);
            color: var(--text);
            padding: 0.25em 0.75em;
            font-size: 0.9em;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        #acti-por {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            gap: 12px;
            padding: 12px;
        }
        .panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            min-width: 0;
            padding: 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-weight: bold;
            color: var(--muted);
            padding: 0 2px;
        }
        #wantfiles {
            flex: 3 1 0;
        }
        #wfe {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            resize: none;
            font-family: Consolas, "Ubuntu Mono", monospace;
            white-space: pre;
            background-color: var(--bg-elev);
        }
        #logPanel {
            flex: 2 1 0;
        }
        #logView {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            display: flex;
            flex-direction: column-reverse;
            padding: 6px 8px;
            font-family: Consolas, "Ubuntu Mono", monospace;
            font-size: 0.85em;
            overflow-wrap: anywhere;
            background-color: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        /* Medium screens: tighter spacing */
        @media (max-width: 1400px), (max-height: 800px) {
            #button-panel { padding: 6px 10px; gap: 6px 12px; }
            #acti-por { padding: 8px; gap: 8px; }
        }
        /* Narrow screens / portrait: stack the panels and let the page scroll */
        @media (max-width: 1000px) {
            body { height: auto; display: block; }
            #acti-por { flex-direction: column; }
            #wantfiles, #logPanel { flex: none; height: 70vh; }
        }

        /* Nice scrollbars */
        #wfe::-webkit-scrollbar, #logView::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        #wfe::-webkit-scrollbar-thumb, #logView::-webkit-scrollbar-thumb {
            background: #2b3340;
            border-radius: 8px;
            border: 2px solid #1a202b;
        }
        #wfe::-webkit-scrollbar-track, #logView::-webkit-scrollbar-track {
            background: #11161d;
            border-radius: 8px;
        }
        #wfe, #logView {
            scrollbar-color: #2b3340 #11161d;
            scrollbar-width: thin;
        }
    </style>
</head>
<body>
<div id="status-view"></div>
<div id="button-panel">
    <div class="tb-group">
        <a href=".."><input id="rtrnToEdi" type="button" value="<<== Return to playlist editor <<=="></a>
    </div>
    <div class="tb-group">
        <input id="startCopy" type="button" value="COPY">
        <input id="startDelete" type="button" value="DELETE">
    </div>
    <div id="userlabel"></div>
    <div class="tb-group">
        <input id="signOut" type="button" value="Sign out">
    </div>
</div>
<div id="acti-por">
    <div class="panel" id="wantfiles">
        <div class="panel-title">
            <span>wanted files</span>
            <input id="saveWfe" type="button" value="SAVE">
        </div>
        <textarea id="wfe" spellcheck="false"></textarea>
    </div>
    <div class="panel" id="logPanel">
        <div class="panel-title">copy log</div>
        <div id="logView">
            
        </div>
    </div>
</div>
</body>
</html>

<script>
    var myUrl = (window.location.protocol + "//" + window.location.hostname + ":" + window.location.port);

    var accessLevels = JSON.parse(httpGet(myUrl + "/checkaccesslevels"));

    if (accessLevels.editor == "none") {
        let toEdiBtn = document.getElementById("rtrnToEdi");
        toEdiBtn.disabled = true;
        toEdiBtn.style.background = "gray";
        toEdiBtn.title = "The editor is disabled!";
    }

    document.getElementById("wfe").value = httpGet(myUrl + "/getWantfiles");

    function updateStatus(type, msg) {
        let statusView = document.getElementById("status-view");
        let currentTime = "";
        if (msg != "") {
            currentTime = (((new Date()).toString()).split(" GMT")[0] + ": ");
        }
        if (type == "ok") {
            statusView.style.color = "green";
            statusView.style.backgroundColor = "#DDFFDD";
        } else if (type == "warn") {
            statusView.style.color = "orange";
            statusView.style.backgroundColor = "#FFFFEE";
        } else {
            statusView.style.color = "red";
            statusView.style.backgroundColor = "#FFDDDD";
        }
        statusView.innerHTML = (currentTime + msg);
    }

    $("#signOut").click(function() {
        httpGet(myUrl + "/logout");

        const cookies = document.cookie.split(";");

        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i];
            const eqPos = cookie.indexOf("=");
            const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
            document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT";
        }
        location.reload();
    });
    
    $("#startCopy").click(function() {
        let res = httpGet(myUrl + "/copierCopy");
        console.log(res);
        if (res == "ok") {
            updateStatus("ok", "Started copying...")
        }
    });
    
    $("#startDelete").click(function() {
        let res = httpGet(myUrl + "/copierDelete");
        if (res == "ok") {
            updateStatus("ok", "Started deleting...");
        }
    });
    
    $("#saveWfe").click(function() {
        saveWantfiles();
    });
    
    updateLog();
    function updateLog() {
        document.getElementById("logView").innerHTML = httpGet(myUrl + "/copylog");
    }

    setInterval(updateLog, 15000);

    var userlabelinfo = JSON.parse(httpGet(myUrl + "/getuserlabel"));
    const userlabel = document.getElementById("userlabel");
    userlabel.innerHTML = userlabelinfo.label;
    userlabel.style.color = userlabelinfo.color;
    userlabel.style.backgroundColor = userlabelinfo.bgcolor;
    
    document.addEventListener('keydown', function(event) {
        if (event.keyCode == 83 && event.ctrlKey) {
            saveWantfiles();
            event.preventDefault();
        }
    });
    
    function saveWantfiles() {
        let ret = httpPost(myUrl + "/pushWantfiles", document.getElementById("wfe").value);
        if (ret == document.getElementById("wfe").value) {
            updateStatus("ok", "Saved wanted-files");
        } else {
            updateStatus("err", "Failed to save wanted-files");
        }
    }
    
    function httpGet(url) {
        var xmlHttp = new XMLHttpRequest();
        xmlHttp.open( "GET", url, false );
        xmlHttp.send( null );
        return xmlHttp.responseText;
    }
    
    function httpPost(url, data) {
        try {
            var xmlHttp = new XMLHttpRequest();
            xmlHttp.open("POST", url, false);
            xmlHttp.send(data);
            return xmlHttp.responseText;
        } catch {
            updateStatus("err", "Communication ERROR! Last action isn't on backend.");
        }
    }
</script>
