<!DOCTYPE html>
<html>
<head>
    <title>temp melichar ply editor</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        :root {
            --bg: #0e0f12;
            --bg-elev: #16181d;
            --panel: #1b1f27;
            --text: #e6e6e6;
            --muted: #9aa4ad;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-active: #1d4ed8;
            --border: #2a2f38;
            --accent: #22c55e;
            --warn: #f59e0b;
            --error: #ef4444;
            --table-row: #14171c;
            --table-row-alt: #101318;
            --shadow: 0 6px 24px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.35);
            --radius: 10px;
            --type-dummy: #ef4444;
            --type-live: #f59e0b;
            --type-warning: #f97316;
            --type-notafiller: #22d3ee;
            --hover-default: #1a2431;
            --hover-notafiller: #192436;
            --hover-dummy: #8a2323;
            --hover-live: #9d4a0f;
            --hover-warning: #874015;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Calibri, Ubuntu;
            font-size: clamp(13px, 0.35vw + 9px, 16px);
            line-height: 1.45;
            margin: 0;
            /* Fill the viewport: toolbars take what they need, tables get the rest */
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        input[type="button"], button {
            background-color: var(--primary);
            color: var(--text);
            transition: background-color 0.2s ease, transform 0.05s ease, box-shadow 0.2s ease;
            border: 1px solid transparent;
            padding: 0.3em 0.7em;
            font-size: 0.85em;
            line-height: 1.3;
            white-space: nowrap;
            border-radius: 6px;
            font-family: Calibri, Ubuntu;
            font-weight: 600;
            box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 2px 6px rgba(59,130,246,0.12);
        }
        input[type="button"]:hover, button:hover {
            background-color: var(--primary-hover);
        }
        input[type="button"]:active, button:active {
            background-color: var(--primary-active);
            transform: translateY(1px);
            box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 1px 4px rgba(29,78,216,0.18);
        }
        select, input[type="file"], input[type="text"], input[type="search"] {
            background-color: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.3em 0.5em;
            border-radius: 6px;
            font-family: Calibri, Ubuntu;
            font-size: 0.85em;
            line-height: 1.3;
            font-weight: 600;
            max-width: 100%;
        }
        /* Compact logo selector inside playlist rows */
        select.logosel {
            min-width: 0;
            max-width: 12em;
            padding: 0.1em 0.3em;
            font-size: 0.85em;
            font-weight: normal;
            border-radius: 4px;
        }
        select {
            min-width: 8em;
            max-width: 22em;
        }
        input[type="checkbox"] {
            accent-color: var(--primary);
        }
        label {
            border: none;
            padding: 5px 0;
            border-radius: 4px;
            font-family: Calibri, Ubuntu;
            font-weight: bold;
            color: var(--muted);
        }
        #button-panel {
            flex: 0 0 auto;
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, rgba(27,31,39,0.92), rgba(27,31,39,0.86));
            backdrop-filter: saturate(140%) blur(6px);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        #topbar, #actionbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            align-items: center;
            padding: 10px 12px;
        }
        #topbar {
            border-bottom: 1px solid var(--border);
        }
        .tb-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            min-width: 0;
        }
        label.tb-check {
            color: var(--text);
            font-weight: normal;
            cursor: pointer;
        }
        #ldSemPly {
            padding: 0.15em 0.4em;
            max-width: 16em;
        }
        #ldSemPly::file-selector-button {
            background-color: var(--bg-elev);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.1em 0.5em;
            margin-right: 0.5em;
            font: inherit;
            cursor: pointer;
        }
        #rowarn {
            font-weight: bold;
            color: var(--warn);
        }
        #userlabel {
            flex: 1 1 12em;
            text-align: center;
            background-color: var(--bg-elev);
            color: var(--text);
            padding: 0.25em 0.75em;
            font-size: 0.9em;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        label[for="ldSemPly"] {
            font-size: 0.85em;
        }
        #acti-por {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            gap: 12px;
            padding: 12px;
        }
        #inspCtgContain, #inspFltrContain {
            display: inline-block;
        }
        .panel-title {
            font-weight: bold;
            color: var(--muted);
            padding: 4px 2px;
        }
        .panel-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
        }
        #inspWr button{
            background-color: var(--panel);
            color: var(--text);
            transition: background-color 0.2s ease;
            border: 1px solid var(--border);
            padding: 0.15em 0.55em;
            margin: 2px 1px;
            border-radius: 5px;
            font-family: Calibri, Ubuntu;
            font-weight: 600;
            box-shadow: none;
        }
        #inspWr button:hover {
            background-color: #232936;
        }
        #inspWr button:active {
            background-color: #1b2230;
        }
        #inspFltrContain button {
            background-color: #243447;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .fixTableHead {
            overflow: auto;
            min-height: 0;
            min-width: 0;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .fixTableHead thead th {
            position: sticky;
            top: 0;
            z-index: 1;
        }
        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            background: transparent;
        }
        th,
        td {
            padding: 0.6em 0.85em;
            border-bottom: 1px solid var(--border);
            border-right: none;
            border-left: none;
        }
        th {
            background: #0f141b;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 0.8em;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
        }
        .even {
            background-color: var(--table-row);
        }
        .notafiller {
            background-color: #15202b;
        }
        .selectedAdd {
            color: #0b1220;
            background-color: #93c5fd;
        }
        .selectedPlyIt {
            color: #0b1220;
            background-color: #93c5fd;
        }
        .selectedPlyIt.notafiller {
            background-color: #67e8f9;
        }
        .dummy {
            background-color: #7f1d1d;
        }
        .selectedPlyIt.dummy {
            background-color: #ef4444;
        }
        .live {
            background-color: #92400e;
        }
        .selectedPlyIt.live {
            background-color: #f59e0b;
        }
        .warning {
            background-color: #7c2d12;
        }
        .selectedPlyIt.warning {
            background-color: #f97316;
        }
        #plyViWr {
            flex: 3 1 0;
            padding: 8px;
        }
        #inspWr {
            flex: 2 1 0;
            padding: 8px;
        }
        #ply-view td, #inspector td {
            overflow-wrap: anywhere;
        }
        #ply-view td {
            vertical-align: middle;
        }
        /* All columns except path: center under their headers */
        #ply-view td:not(:nth-child(3)) {
            text-align: center;
        }
        select.logosel,
        #ply-view td input[type="checkbox"] {
            vertical-align: middle;
            margin: 0;
        }
        #buttonsOnRight {
            margin-left: auto;
        }
        #status-view {
            flex: 0 0 auto;
            margin: 10px 12px 0 12px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-elev);
        }
        #status-view:empty { display: none; }

        /* Medium screens (e.g. 1366x768, 1280x1024): tighter spacing */
        @media (max-width: 1400px), (max-height: 800px) {
            #topbar, #actionbar { padding: 6px 10px; gap: 6px 12px; }
            #acti-por { padding: 8px; gap: 8px; }
            th, td { padding: 0.45em 0.6em; }
        }
        /* Narrow screens / portrait: stack the panels and let the page scroll */
        @media (max-width: 1000px) {
            body { height: auto; display: block; }
            #acti-por { flex-direction: column; }
            #plyViWr, #inspWr { flex: none; height: 70vh; }
            #buttonsOnRight { margin-left: 0; }
        }

        /* Row hover */
        #ply-view tbody tr,
        #inspector tbody tr { cursor: default; }
        #ply-view tbody tr:hover,
        #inspector tbody tr:hover { background-color: var(--hover-default); }

        /* Preserve selection and type colors on hover */
        #ply-view tbody tr.selectedPlyIt:hover { background-color: #93c5fd; color: #0b1220; }
        #inspector tbody tr.selectedAdd:hover { background-color: #93c5fd; color: #0b1220; }

        /* Preserve type cues on hover */
        #ply-view tbody tr.dummy:hover { background-color: var(--hover-dummy); }
        #ply-view tbody tr.live:hover { background-color: var(--hover-live); }
        #ply-view tbody tr.warning:hover { background-color: var(--hover-warning); }
        #ply-view tbody tr.notafiller:not(.dummy):not(.live):not(.warning):not(.selectedPlyIt):hover { background-color: var(--hover-notafiller); }

        /* Combined: ensure selected + type variants keep their special states */
        #ply-view tbody tr.selectedPlyIt.notafiller { color: #0b1220; }
        #ply-view tbody tr.selectedPlyIt.notafiller:hover { background-color: #67e8f9; color: #0b1220; }
        #ply-view tbody tr.selectedPlyIt.dummy:hover { background-color: #ef4444; }
        #ply-view tbody tr.selectedPlyIt.live:hover { background-color: #f59e0b; }
        #ply-view tbody tr.selectedPlyIt.warning:hover { background-color: #f97316; }

        /* Persistent type markers via left accent bar (works across hover/selection) */
        #ply-view tbody tr.dummy { box-shadow: inset 4px 0 0 var(--type-dummy); }
        #ply-view tbody tr.live { box-shadow: inset 4px 0 0 var(--type-live); }
        #ply-view tbody tr.warning { box-shadow: inset 4px 0 0 var(--type-warning); }
        #ply-view tbody tr.dummy.selectedPlyIt,
        #ply-view tbody tr.dummy:hover { box-shadow: inset 4px 0 0 var(--type-dummy); }
        #ply-view tbody tr.live.selectedPlyIt,
        #ply-view tbody tr.live:hover { box-shadow: inset 4px 0 0 var(--type-live); }
        #ply-view tbody tr.warning.selectedPlyIt,
        #ply-view tbody tr.warning:hover { box-shadow: inset 4px 0 0 var(--type-warning); }

        /* Not-a-filler persistent right accent stripe (non-conflicting with left type bar) */
        #ply-view tbody tr.notafiller {
            background-image: linear-gradient(to left, var(--type-notafiller), var(--type-notafiller));
            background-size: 4px 100%;
            background-position: right top;
            background-repeat: no-repeat;
        }
        #ply-view tbody tr.notafiller:hover,
        #ply-view tbody tr.notafiller.selectedPlyIt { /* keep stripe on hover/selection */
            background-image: linear-gradient(to left, var(--type-notafiller), var(--type-notafiller));
        }

        /* Nice scrollbars */
        .fixTableHead::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        .fixTableHead::-webkit-scrollbar-thumb {
            background: #2b3340;
            border-radius: 8px;
            border: 2px solid #1a202b;
        }
        .fixTableHead::-webkit-scrollbar-track {
            background: #11161d;
            border-radius: 8px;
        }
        .fixTableHead {
            scrollbar-color: #2b3340 #11161d;
            scrollbar-width: thin;
        }
    </style>
</head>
<body>
<div id="status-view"></div>
<div id="button-panel">
    <div id="topbar">
        <div class="tb-group">
            <input id="save" type="button" value="SAVE">
            <select id="ldfilename"></select>
            <input id="load" type="button" value="LOAD">
        </div>
        <label class="tb-group tb-check" for="autoScroll">
            <input type="checkbox" id="autoScroll"> enable auto scroll (use alt + up/down to scroll manually)
        </label>
        <div class="tb-group">
            <input id="exportNewMelPly" type="button" value="EXPORT M1 PLY" title="experimental feature">
            <select id="ldjsonfilename"></select>
            <input id="importNewMelPly" type="button" value="IMPORT M1 PLY" title="experimental feature">
        </div>
        <span id="rowarn"></span>
        <div id="userlabel"></div>
    </div>
    <div id="actionbar">
        <div class="tb-group">
            <input id="insert" type="button" value="INSERT">
            <input id="add" type="button" value="ADD">
        </div>
        <div class="tb-group">
            <input id="ins-dummy" type="button" value="INSERT DUMMY">
            <input id="add-dummy" type="button" value="ADD DUMMY">
        </div>
        <div class="tb-group">
            <input id="ins-live" type="button" value="INSERT LIVE">
            <input id="add-live" type="button" value="ADD LIVE">
        </div>
        <div class="tb-group">
            <input id="remove" type="button" value="DELETE">
        </div>
        <div class="tb-group">
            <input id="mvUp" type="button" value="UP">
            <input id="mvDwn" type="button" value="DOWN">
        </div>
        <div class="tb-group">
            <label for="ldSemPly">LOAD PLY FROM SEM:</label><input id="ldSemPly" type="file" accept=".ply,.txt" onChange="loadSemPly()">
        </div>
        <div class="tb-group">
            <input id="updInsp" type="button" value="UPDATE AVAILABLE CLIPS">
        </div>
        <div id="buttonsOnRight" class="tb-group">
            <a href="copy"><input id="gotoFilecopier" type="button" value="==>> GO TO FILE COPIER ==>>"></a>
            <input id="signOut" type="button" value="Sign out">
        </div>
    </div>
</div>
<div id="acti-por">
    <div class="fixTableHead" id="plyViWr">
        <div class="panel-title">playlist</div>
        <table id="ply-view">
            <thead>
                <tr><th>start time</th><th>duration</th><th>path</th><th>logo</th><th>logo 4:3</th><th>disable IS</th><th>loop</th></tr>
            </thead>
            <tbody id="plyitemstbl">
                
            </tbody>
        </table>
    </div>
    <div class="fixTableHead" id="inspWr">
        <div class="panel-controls">
            <label class="tb-check" for="filterToggle"><input type="checkbox" id="filterToggle" checked> enable filtering</label>
            <label class="tb-check" for="filterSubstrToggle"><input type="checkbox" id="filterSubstrToggle"> enable substring filtering</label>
        </div>
        <div class="panel-title">available clips:</div>
        <div id="inspCtgContain"></div><div id="inspFltrContain"></div>
        <table id="inspector">
            <thead>
                <tr><th>name</th><th>duration</th></tr>
            </thead>
            <tbody id="avaClipTabl">
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

<script>
    var uiLdPly = {plyitems:[]};
    var availableClips;
    var availableLogos;
    var availClipCategories = [];
    var currClipCategory = "";
    var availClipFilters = [];
    var currClipFilter = "";

    var myUrl = (window.location.protocol + "//" + window.location.hostname + ":" + window.location.port);
    
    var selectedPlyItem = -1;
    var selectedAddItem = -1;
    
    var curLdPlyName;
    var unsavedChanges = false;

    var accessLevels = JSON.parse(httpGet(myUrl + "/checkaccesslevels"));

    if (accessLevels.editor == "read") {
        let savebutton = document.getElementById("save");
        savebutton.disabled = true;
        savebutton.style.backgroundColor = "gray";
        savebutton.title = "The editor is in read-only mode!";
        document.getElementById("rowarn").innerHTML = "READ-ONLY MODE!";
    }
    if (accessLevels.copier != true) {
        let gotocopbutton = document.getElementById("gotoFilecopier");
        gotocopbutton.disabled = true;
        gotocopbutton.style.backgroundColor = "gray";
        gotocopbutton.title = "The file copier is disabled!";
    }

    var userlabelinfo = JSON.parse(httpGet(myUrl + "/getuserlabel"));
    const userlabel = document.getElementById("userlabel");
    userlabel.innerHTML = userlabelinfo.label;
    userlabel.style.color = userlabelinfo.color;
    userlabel.style.backgroundColor = userlabelinfo.bgcolor;

    function confirmClose() {
        if (unsavedChanges) {
            console.log("unsaved changes");
            return confirm("You have unsaved changes! Proceed?");
        } else {
            console.log("confirming close");
            return true;
        }
    }

    window.addEventListener("beforeunload", (event) => {
        if (unsavedChanges) {
            event.returnValue = "You have unsaved changes! Proceed?";
        }
    });

    $("#signOut").click(function() {
        if (confirmClose()) {
            httpGet(myUrl + "/logout");

            const cookies = document.cookie.split(";");

            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i];
                const eqPos = cookie.indexOf("=");
                const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT";
            }
            location.reload();
        }
    });

    function updateStatus(type, msg) {
        let statusView = document.getElementById("status-view");
        let currentTime = "";
        if (msg != "") {
            currentTime = (((new Date()).toString()).split(" GMT")[0] + ": ");
        }
        if (type == "ok") {
            statusView.style.color = "green";
            statusView.style.backgroundColor = "#DDFFDD";
        } else if (type == "warn") {
            statusView.style.color = "orange";
            statusView.style.backgroundColor = "#FFFFEE";
        } else {
            statusView.style.color = "red";
            statusView.style.backgroundColor = "#FFDDDD";
        }
        statusView.innerHTML = (currentTime + msg);
    }
    
    function loadSemPly() {
        let file = document.getElementById("ldSemPly").files[0];
        if (file) {
            var reader = new FileReader();
            reader.readAsText(file, "UTF-8");
            reader.onload = function (evt) {
                let semPlyItemsByLine = evt.target.result.replace(/ /g, "");
                semPlyItemsByLine = semPlyItemsByLine.replace(/X:\\/g,"");
                semPlyItemsByLine = semPlyItemsByLine.replace(/\\/g,"\/");
                semPlyItemsByLine = semPlyItemsByLine.split("\r\n");
                for (let semLine of semPlyItemsByLine) {
                    let itemToAdd = {};
                    itemToAdd.id = uiLdPly.plyitems.length;
                    itemToAdd.type = "clip";
                    itemToAdd.path = semLine;
                    uiLdPly.plyitems.push(itemToAdd);
                    console.log("test0");
                }
                checkItmsPlyAgainstInsp(true);
                drawPlaylist();
            }
            reader.onerror = function (evt) {
                window.alert("unspecified error");
            }
        }

    }
    
    function checkItmsPlyAgainstInsp(changedurs) {
        // Checks items from playlist against inspector items while loading
        let nextStartTime = new Date(Date.now());
        nextStartTime.setHours(6, 0, 0);
        console.log("test1");
        if (availableClips) {
            console.log("test2");
            for (let plitem of uiLdPly.plyitems) {
                console.log(plitem.path);
                for (let avaClip of availableClips.data) {
                    //console.log(avaClip.name);
                    if (avaClip.name == plitem.path) {
                        console.log("test5");
                        if (plitem.duration != avaClip.duration) {
                            console.log("test6");
                            if (!changedurs) {
                                if ((Math.trunc(avaClip.duration*1000))/1000 != plitem.duration) {
                                    plitem.warning = "duration mismatch";
                                } // ineffective but easy for now
                            } else {
                                console.log("test7");
                                plitem.duration = avaClip.duration;
                                plitem.startTime = nextStartTime;
                                nextStartTime = nextStartTime - -(plitem.duration*1000);
                            }
                        }
                        break;
                    }
                }
                if (!plitem.startTime) {
                    plitem.startTime = nextStartTime;
                    plitem.duration = 0;
                }
            }
        }
    }
    
    $("#updInsp").click(function() {
        updateInspector();
    });
    
    updateInspector();
    
    function updateInspector() {
        availableClips = JSON.parse(httpGet(myUrl + "/clips"));
        let inspItOdd = false;
        if (availableClips.status == "ok") {
            console.log(availableClips.status);
            var clipToWriteToInsp = "";
            var wayBack = currClipCategory.split("/");
            wayBack = currClipCategory.replace((wayBack[wayBack.length - 2] + "/"), "");
            var clipCatToWrite = "<button class=\"ctgbtn\" value=\"\">root</button><button class=\"ctgbtn\" value=\"" + wayBack + "\">back</button>";
            availClipCategories = [];
            availableLogos = [];
            availClipFilters = [];
            let prevClipBegi = "";
            var clipFilterToWrite = "<button class=\"fltrbtn\" value=\"\">clear</button>";
            for (var i = 0; i < availableClips.data.length; i++) {
                //availableClips.data[i].name = (availableClips.data[i].name).replace("aaavyplne", "_0vyplne");
                if (document.getElementById("filterToggle").checked) {
                    if ((availableClips.data[i].name).match("\^" + currClipCategory + "\.*" + "/")) {
                        let newcatg = (((availableClips.data[i].name.replace(currClipCategory, "")).split('/'))[0] + "/");
                        for (clipcategory of availClipCategories) {
                            if (newcatg == clipcategory) {
                                newcatg = null;
                                break;
                            }
                        }
                        if (newcatg != null){
                            availClipCategories.push(newcatg);
                            clipCatToWrite += ("<button class=\"ctgbtn\" value=\"" + (currClipCategory + newcatg) + "\">" + newcatg + "</button>");
                        }
                    }
                    if (document.getElementById("filterSubstrToggle").checked && availableClips.data[i].name.match("\^" + currClipCategory)) {
                        let currClipBegi = availableClips.data[i].name.match(/\/(?:.(?!\/))+$/);
                        if (currClipBegi == null) {
                            currClipBegi = availableClips.data[i].name;
                        } else {
                            currClipBegi = currClipBegi[0];
                        }
                        currClipBegi = currClipBegi.slice(0,6);
                        if (currClipBegi.match(prevClipBegi)) {
                            if (availClipFilters.indexOf(currClipBegi) == -1) {
                                availClipFilters.push(currClipBegi);

    function drawPlaylist() {
        var plyToDraw = "";
        for (let i = 0; i < uiLdPly.plyitems.length; i++) {
            plyToDraw += "<tr class=\"plyitem";
            
            if (i%2 == 0) {
                plyToDraw += " even";
            }
            
            var startTimeUTCms = new Date(Math.floor(uiLdPly.plyitems[i].startTime));
            var startTimeString = startTimeUTCms.toLocaleString('en-GB', {timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone});
            startTimeString = startTimeString.replace(/..\/..\/...., /, "");
            
            var plitDurHour = Math.trunc(uiLdPly.plyitems[i].duration/3600);
            if (plitDurHour < 10) {plitDurHour = "0" + plitDurHour;}
            var plitDurMinu = Math.trunc((uiLdPly.plyitems[i].duration-(plitDurHour*3600))/60);
            if (plitDurMinu < 10) {plitDurMinu = "0" + plitDurMinu;}
            var plitDurSeco = Math.floor(uiLdPly.plyitems[i].duration-(plitDurHour*3600)-(plitDurMinu*60));
            if (plitDurSeco < 10) {plitDurSeco = "0" + plitDurSeco;}
            var plitDurDisp = plitDurHour + ":" + plitDurMinu + ":" + plitDurSeco;
            
            var dummyOrNot = " dummy";
            if (uiLdPly.plyitems[i].type == "stream") {
                dummyOrNot = " live";
            } else {
                if (availableClips) {
                    for (nomInsp of availableClips.data) {
                        if (uiLdPly.plyitems[i].path == nomInsp.name) {
                            dummyOrNot = "";
                            break;
                        }
                    }
                }
            }
            
            let warningOrNot = "";
            if (uiLdPly.plyitems[i].warning == "duration mismatch") {
                warningOrNot = " warning";
            }

            let fillerOrNot = "";
            if (!((uiLdPly.plyitems[i].path).match("0vyplne/"))) {
                fillerOrNot = " notafiller";
            }

            let logoshiftins = "";
            if (uiLdPly.plyitems[i].logoshift) {
                logoshiftins = "checked";
            }

            let disableistrins = "";
            if (uiLdPly.plyitems[i].disableistr) {
                disableistrins = "checked";
            }

            let loopins = "";
            if (uiLdPly.plyitems[i].loop) {
                loopins = "checked";
            }
            
            plyToDraw += (dummyOrNot + warningOrNot + fillerOrNot + "\" id=\"" + i + "\"><td>" + startTimeString + "</td><td>" + plitDurDisp + "</td><td>" + uiLdPly.plyitems[i].path + "</td><td><select class=\"logosel\" id=\"logo" + i + "\"><option value=\"" + uiLdPly.plyitems[i].logo + "\">" + uiLdPly.plyitems[i].logo + "</option></select></td><td><input type=\"checkbox\" class=\"logo43shift\" id=\"lo43go" + i + "\" " +  logoshiftins + "></td><td><input type=\"checkbox\" class=\"disableistr\" id=\"disableistream" + i + "\" " + disableistrins + "></td><td><input type=\"checkbox\" class=\"loopchkbox\" id=\"loop" + i + "\" " + loopins +"></td></tr>");
        }
        document.getElementById("plyitemstbl").innerHTML = plyToDraw;
        if (selectedPlyItem != -1) {
            document.getElementById(selectedPlyItem).classList.add("selectedPlyIt");
        }
        $(".plyitem").click(function(){
            conInsp = false;
            if (selectedPlyItem != -1) {
                document.getElementById(selectedPlyItem).classList.remove("selectedPlyIt");
            }
            selectedPlyItem = this.id;
            document.getElementById(selectedPlyItem).classList.add("selectedPlyIt");
        });
        $(".plyitem").dblclick(function(){

    function savePly(mode) {
        if (accessLevels.editor == "full") {
            let savefilename = "";
            if (mode && mode == "json") {
                savefilename = window.prompt("Playlist name:", "playlist-yyyy-mm-dd.ply");
            } else {
                savefilename = window.prompt("Playlist name:", curLdPlyName || "playlist_yyyymmdd.ply");
            }
            if (savefilename != null && savefilename != "") {
                if (!savefilename.match(/\.ply$/)) {
                    savefilename = savefilename + ".ply";
                }
                var sendPlyObj = {};
                sendPlyObj.ply = uiLdPly;
                sendPlyObj.name = savefilename;
                let saveStatus = {};
                if (mode && mode == "json") {
                    saveStatus = JSON.parse(httpPost(myUrl + "/saveJson", JSON.stringify(sendPlyObj)));
                } else {
                    saveStatus = JSON.parse(httpPost(myUrl + "/save", JSON.stringify(sendPlyObj)));
                    curLdPlyName = savefilename;
                }
                if (saveStatus.status == "ok") {
                    updateStatus("ok", "Playlist saved successfully");
                    unsavedChanges = false;
                } else {
                    updateStatus("err", "Failed to save playlist!");
                }
            } else {
                window.alert("You need to specify the filename!");
            }
        } else {
            window.alert("The editor is in READ-ONLY MODE! \nSaving is disabled.");
        }
    }

    function loadPly(cfilenameitem) {
        if (confirmClose()) {
            let filenameitem = cfilenameitem || "ldfilename";
            let plyToLoadList = document.getElementById(filenameitem);
            if (plyToLoadList.value != "" && plyToLoadList.value != null && plyToLoadList.value != undefined) {
                console.log(plyToLoadList.value);
                if (cfilenameitem) {
                    uiLdPly.plyitems = JSON.parse(httpPost((myUrl + "/openJson"), plyToLoadList.value));
                } else {
                    uiLdPly.plyitems = JSON.parse(httpPost((myUrl + "/open"), plyToLoadList.value));
                }
                uiLdPly.plyitems[0].id = 0;
                uiLdPly.plyitems[0].startTime = new Date(Date.now());
                uiLdPly.plyitems[0].startTime = uiLdPly.plyitems[0].startTime.setHours(6, 0, 0);
                for (let i = 1; i < uiLdPly.plyitems.length; i++) {
                    uiLdPly.plyitems[i].id = i;
                    uiLdPly.plyitems[i].startTime = (uiLdPly.plyitems[i-1].startTime + (uiLdPly.plyitems[i-1].duration*1000));
                }
                if (selectedPlyItem >= uiLdPly.plyitems.length) {
                    selectedPlyItem = (uiLdPly.plyitems.length - 1);
                }
                if (cfilenameitem) {
                    for (let plyitem of uiLdPly.plyitems) {
                        for (let avaitem of availableClips.data) {
                            let modpath = avaitem.name;
                            modpath = modpath.toUpperCase();
                            modpath = modpath.replace(/\..*$/, "");
                            if (modpath == plyitem.path) {
                                plyitem.path = avaitem.name;
                                break;
                            }
                        }
                    }
                }
                checkItmsPlyAgainstInsp(false);
                drawPlaylist();
                curLdPlyName = plyToLoadList.value;
                unsavedChanges = false;
            } else {
                alert("You need to specify filename to load!");
            }
        }
    }

            let recountFrom = 0;
            if (selectedPlyItem > 0) recountFrom = selectedPlyItem - 1;
            for (let i = recountFrom; i < uiLdPly.plyitems.length; i++) {
                uiLdPly.plyitems[i].id = i;
                if (i > 0) {
                    uiLdPly.plyitems[i].startTime = (uiLdPly.plyitems[i-1].startTime + (uiLdPly.plyitems[i-1].duration*1000));
                } else if (i == 0) {
                    uiLdPly.plyitems[i].startTime = new Date(Date.now());
                    uiLdPly.plyitems[i].startTime = uiLdPly.plyitems[i].startTime.setHours(6, 0, 0);
                }
            }
            drawPlaylist();
            unsavedChanges = true;
            if (accessLevels.editor == "read") {
                window.alert("The editor is in READ-ONLY MODE! \nYou will not be able to save the playlist.");
            }
        }
    }
    
    var conInsp = false;
    
    document.addEventListener('keydown', function(event) {
        switch(event.keyCode) {
            //insert key
            case 45:
                conInsp = true;
                break;
                
            //up arrow
            case 38:
                event.preventDefault();
                if (event.ctrlKey) {
                    mvItem(-1);
                } else if (event.altKey) {
                    var whatWillScroll;
                    if (!conInsp) {
                        whatWillScroll = document.getElementById("plyViWr");
                    } else {
                        whatWillScroll = document.getElementById("inspWr");
                    }
                    whatWillScroll.scrollTo({top: whatWillScroll.scrollTop - 200, behavior: "smooth"});
                } else if (!conInsp && selectedPlyItem > 0) {
                    document.getElementById(selectedPlyItem).classList.remove("selectedPlyIt");
                    selectedPlyItem -= 1;
                    document.getElementById(selectedPlyItem).classList.add("selectedPlyIt");
                    if (document.getElementById("autoScroll").checked) {
                        document.getElementById(selectedPlyItem).scrollIntoView({behavior: "smooth", block: "end"});
                    }
                } else if (selectedAddItem.replace("acl", "") > 0) {
                    document.getElementById(selectedAddItem).classList.remove("selectedAdd");
                    selectedAddItem = selectedAddItem.replace("acl", "");
                    selectedAddItem -= 1;
                    selectedAddItem = ("acl" + selectedAddItem);
                    document.getElementById(selectedAddItem).classList.add("selectedAdd");
                    if (document.getElementById("autoScroll").checked) {
                        document.getElementById(selectedAddItem).scrollIntoView({behavior: "smooth", block: "end"});
                    }
                }
                break;
                
            //down arrow
            case 40:
                event.preventDefault();
                if (event.ctrlKey) {
                    mvItem(1);
                } else if (event.altKey) {
                    var whatWillScroll;
                    if (!conInsp) {
                        whatWillScroll = document.getElementById("plyViWr");
                    } else {
                        whatWillScroll = document.getElementById("inspWr");
                    }
                    whatWillScroll.scrollTo({top: whatWillScroll.scrollTop + 200, behavior: "smooth"});
                } else if (!conInsp && selectedPlyItem < uiLdPly.plyitems.length - 1) {
                    document.getElementById(selectedPlyItem).classList.remove("selectedPlyIt");
                    selectedPlyItem -= -1;
                    document.getElementById(selectedPlyItem).classList.add("selectedPlyIt");
                    if (document.getElementById("autoScroll").checked) {
                        document.getElementById(selectedPlyItem).scrollIntoView({behavior: "smooth", block: "end"});
                    }
                } else if (selectedAddItem.replace("acl", "") < availableClips.data.length - 1) {
                    document.getElementById(selectedAddItem).classList.remove("selectedAdd");
                    selectedAddItem = selectedAddItem.replace("acl", "");
                    selectedAddItem -= -1;
                    selectedAddItem = ("acl" + selectedAddItem);
                    document.getElementById(selectedAddItem).classList.add("selectedAdd");
                    if (document.getElementById("autoScroll").checked) {
                        document.getElementById(selectedAddItem).scrollIntoView({behavior: "smooth", block: "end"});
                    }
                }
                break;
                
            //enter
            case 13:
                if (conInsp) {
                    if (event.ctrlKey) {
                        addSelToPly();
                        conInsp = false;
                    } else {
                        insSelToPly();
                        conInsp = false;
                    }
                }
                break;
                
            //delete
            case 46:
                deleteItemFromPly();
                break;
            
            //escape
            case 27:
                conInsp = false;
                break;
                
            //ctrl + s
            case 83:
                if (event.ctrlKey) {
                    savePly();
                    event.preventDefault();
                }
                break;
            case 76:
                document.getElementById("autoScroll").checked = !document.getElementById("autoScroll").checked;
        }
    }, true);
    
    function httpGet(url) {
        var xmlHttp = new XMLHttpRequest();
        xmlHttp.open( "GET", url, false );
        xmlHttp.withCredentials = true;
        xmlHttp.send( null );
        return xmlHttp.responseText;
    }
    
    function httpPost(url, data) {
        try {
            var xmlHttp = new XMLHttpRequest();
            xmlHttp.open("POST", url, false);
            xmlHttp.withCredentials = true;
            xmlHttp.send(data);
            return xmlHttp.responseText;
        } catch {
            updateStatus("err", "Communication ERROR! Last action isn't on the back-end");
        }
    }
</script>
