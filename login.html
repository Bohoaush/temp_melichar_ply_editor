<!DOCTYPE html>
<html>
<head>
    <title>temp melichar ply editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        :root {
            --bg: #0e0f12;
            --bg-elev: #16181d;
            --panel: #1b1f27;
            --text: #e6e6e6;
            --muted: #9aa4ad;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-active: #1d4ed8;
            --border: #2a2f38;
            --shadow: 0 6px 24px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.35);
            --radius: 10px;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Calibri, Ubuntu;
            font-size: clamp(13px, 0.35vw + 9px, 16px);
            line-height: 1.45;
            margin: 0;
        }
        input[type="button"], button {
            background-color: var(--primary);
            color: var(--text);
            transition: background-color 0.2s ease, transform 0.05s ease, box-shadow 0.2s ease;
            border: 1px solid transparent;
            padding: 0.3em 0.7em;
            font-size: 0.85em;
            line-height: 1.3;
            white-space: nowrap;
            border-radius: 6px;
            font-family: Calibri, Ubuntu;
            font-weight: 600;
            box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 2px 6px rgba(59,130,246,0.12);
        }
        input[type="button"]:hover, button:hover {
            background-color: var(--primary-hover);
        }
        input[type="button"]:active, button:active {
            background-color: var(--primary-active);
            transform: translateY(1px);
            box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 1px 4px rgba(29,78,216,0.18);
        }
        input[type="text"], input[type="password"], textarea {
            background-color: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.3em 0.5em;
            border-radius: 6px;
            font-family: Calibri, Ubuntu;
            font-size: 0.85em;
            line-height: 1.3;
            max-width: 100%;
        }
        input:focus, textarea:focus {
            outline: 2px solid var(--primary);
            outline-offset: -1px;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #loginBox {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 22em;
            padding: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        #loginTitle {
            font-weight: bold;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 0.8em;
        }
        #loginRow {
            display: flex;
            gap: 6px;
        }
        #password {
            flex: 1 1 auto;
            min-width: 0;
        }
    </style>
</head>
<body>
<div id="loginBox">
    <div id="loginTitle">temp melichar ply editor</div>
    <div id="loginRow">
        <input id="password" type="password" placeholder="password" required autofocus>
        <button id="loginBtn">login</button>
    </div>
</div>
</body>
</html>

<script>
    var myUrl = (window.location.protocol + "//" + window.location.hostname + ":" + window.location.port);
    
    $("#loginBtn").click(function() {
        login();
    });
    
    document.addEventListener('keydown', function(event) {
        if (event.keyCode == 13) {
            event.preventDefault();
            login();
        }
    });

    function login() {
        httpPost(myUrl + "/login", document.getElementById("password").value);
        location.reload();
    }
    
    function httpGet(url) {
        var xmlHttp = new XMLHttpRequest();
        xmlHttp.open( "GET", url, false );
        xmlHttp.send( null );
        return xmlHttp.responseText;
    }
    
    function httpPost(url, data) {
        var xmlHttp = new XMLHttpRequest();
        xmlHttp.open("POST", url, false);
        xmlHttp.send(data);
        return xmlHttp.responseText;
    }
</script>
